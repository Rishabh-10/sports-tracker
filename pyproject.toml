[project]
name = "sports-info"
version = "0.1.0"
description = "Personal sports assistant: fixtures, news and predictions for the teams you follow"
requires-python = ">=3.11"
dependencies = [
    "streamlit>=1.40",
    "sqlmodel>=0.0.48",
    "httpx>=0.27",
    "python-dotenv>=1.0",
    "tzdata>=2024.1",
    "tzlocal>=5.2",
    "feedparser>=6.0",
    "trafilatura>=2.0",
    "fastembed>=0.9",
    "numpy>=2.0",
    "google-genai>=2.0",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
